<!DOCTYPE html>

<html lang="pt-BR">

<head>


    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- habilitando para disp moveis-->
    <title>Mangacon</title> <!-- colocando o nome na aba-->
    <link rel="stylesheet" href="style.css">  <!-- conecatando arquivo de estilo-->


</head>

<body>

    <header>

        <h1>MANGA<span>con</span></h1>
        <p>Descubra mundos completamente novos</p>

        <!-- aba de pesquisa do manga -->
        <div class="filtros">

            <!-- filtro pelo nome -->
            <input  
                type="text"                    
                id="campo_busca" 
                placeholder="Pesquisar mangá..."
            >
            <select id="categoria_escolhida">                       <!-- filtro de categorias -->
                <option value="Todas">Todas</option>
                <option value="Ação">Ação</option>
                <option value="Aventura">Aventura</option>
                <option value="Fantasia">Fantasia</option>
                <option value="Escolar">Escolar</option>
                <option value="Artes marciais">Artes Marciais</option>

            </select>

        </div>

    </header>





<!-- conteudo principal -->
    <main>

        <section id="catalogo">

            <h2>OBRAS POPULARES</h2>

            <div id="Listar-Mangas"> </div> <!-- Os produtos serão inseridos pelo JavaScript -->


        </section>
  

    </main>

    <script src="app.js"></script> <!-- conecta arquivo javaScript -->>
</body>
</html>
