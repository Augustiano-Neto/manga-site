<!DOCTYPE html>

<html lang="pt-BR">

<head>


    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- habilitando para disp moveis-->
    <title>Mangacon</title> <!-- colocando o nome na aba-->
    <link rel="stylesheet" href="style.css">  <!-- conecatando arquivo de estilo-->


</head>

<body>

    <header>

        <h1>MANGA<span>con</span></h1>
        <h2>Descubra mundos completamente novos</h2>


        <!-- [R3] QUESTAO 3 ====================================================================================================== -->

        <!-- aba de pesquisa do manga -->
        <div class="filtros">

            <!-- filtro pelo nome -->
            <input  
                type="text"                    
                id="campo_busca" 
                placeholder="Pesquisar mangá..."
            >
            <select id="categoria_escolhida">                       <!-- filtro de categorias -->
                <option value="Todas">Todas</option>
                <option value="Ação">Ação</option>
                <option value="Aventura">Aventura</option>
                <option value="Fantasia">Fantasia</option>
                <option value="Escolar">Escolar</option>
                <option value="Artes marciais">Artes Marciais</option>

            </select>

        </div>

         <!-- [R3] QUESTAO 3 ====================================================================================================== -->
          
    </header>







<!-- conteudo principal -->
    <main>

   

        <section id="catalogo">

            <h2>OBRAS POPULARES</h2>

            <div id="Listar-Mangas"> </div> <!-- Os produtos serão inseridos pelo JavaScript -->


        </section>
  
 <!-- [R4] QUESTAO 4 ========================================================================================================= -->

    <div id="caixas_finais">

        <section id="cadastro" class="caixa_cadastro">
            
            <h2>CADASTRO DE MANGÁ</h2>

            <form id="formCadastro" novalidate>

                <label for="nome">Nome:</label><p> 
                <input type="text" id="nome">
                <p>
                <label for="descricao">Descrição:</label><p> 
                <input type="text" id="descricao">
                <p>   
                <label for="ano_lancamento">Ano de Lançamento:</label><p> 
                <input type="number" id="ano_lancamento">
                <p>     
                <label for="numero_capitulos">Número de Capítulos:</label><p>
                <input type="number" id="numero_capitulos">
                <p>    
                <select id="cadastro_categoria">
                    <option value="">Selecione uma opção</option>
                    <option value="Ação">Ação</option>
                    <option value="Aventura">Aventura</option>
                    <option value="Fantasia">Fantasia</option>
                    <option value="Suspense">Suspense</option>
                    <option value="Terror">Terror</option>
                    <option value="Sobrenatural">Sobrenatural</option>
                    <option value="Histórico">Histórico</option>
                    <option value="Psicológico">Psicológico</option>
                    <option value="Artes Marciais">Artes Marciais</option>
                    <option value="Escolar">Escolar</option>
                </select>

                <button type="submit">Enviar</button>
                
            </form>

            <p id="mensagem"></p>
        </section>

<!-- [R4] QUESTAO 4 ========================================================================================================= -->

<!-- [R6] QUESTAO 6 ========================================================================================================= -->

<section id="painel_estatisticas">

    <h2>Estatísticas dos Mangás</h2>

    <p>Total de mangás: <span id="painel_total">0</span></p>

    <p>Favoritos: <span id="painel_favoritos">0</span></p>

    <p>Média das notas: <span id="painel_media">—</span></p>

    <p>Maior nota: <span id="painel_maior">—</span></p>

</section>

</div>
 <!-- [R6] QUESTAO 6 ========================================================================================================= -->


    </main>

    <script src="js/app.js" defer></script> <!-- conecta arquivo javaScript -->
</body>
</html>
